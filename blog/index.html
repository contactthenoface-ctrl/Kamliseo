  <style>

    /* =====================================================
       BLOG
       ===================================================== */

    .blog-featured {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 30px;
      margin-bottom: 50px;
    }

    .blog-featured-card {
      border-radius: 18px;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--gray-200);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .blog-featured-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    /* IMAGE ARTICLE PRINCIPAL */

    .blog-featured-card .blog-thumb {
      height: 280px;
      overflow: hidden;
      position: relative;
      background: var(--gray-100);
    }

    .blog-featured-card .blog-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .blog-featured-card:hover .blog-thumb img {
      transform: scale(1.04);
    }

    .blog-featured-card .blog-body {
      padding: 32px;
    }

    .blog-featured-card h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .blog-featured-card p {
      color: var(--gray-500);
      font-size: 1rem;
      margin-bottom: 16px;
    }


    /* =====================================================
       ARTICLES SECONDAIRES
       ===================================================== */

    .blog-featured-side {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .blog-mini-card {
      display: flex;
      gap: 16px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      padding: 16px;
      transition: var(--transition);
      align-items: center;
    }

    .blog-mini-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateX(4px);
    }

    .blog-mini-thumb {
      width: 100px;
      height: 80px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--gray-100);
    }

    .blog-mini-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .blog-mini-card:hover .blog-mini-thumb img {
      transform: scale(1.06);
    }

    .blog-mini-card h3 {
      font-size: .95rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .blog-mini-card .blog-meta {
      font-size: .78rem;
    }


    /* =====================================================
       CATEGORIES
       ===================================================== */

    .blog-category-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 40px;
    }

    .blog-cat {
      padding: 8px 20px;
      border-radius: 50px;
      font-size: .85rem;
      font-weight: 600;
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1px solid var(--gray-200);
      transition: var(--transition);
      cursor: pointer;
    }

    .blog-cat:hover,
    .blog-cat.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }


    /* =====================================================
       CARTES ARTICLES
       ===================================================== */

    .blog-card {
      overflow: hidden;
      border-radius: 16px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      transition: var(--transition);
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .blog-card .blog-thumb {
      height: 200px;
      overflow: hidden;
      background: var(--gray-100);
    }

    .blog-card .blog-thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .blog-card:hover .blog-thumb img {
      transform: scale(1.05);
    }

    .blog-card .blog-body {
      padding: 24px;
    }

    .blog-card h3 {
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .blog-card p {
      color: var(--gray-500);
      font-size: .92rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }


    /* =====================================================
       IMAGE LABEL
       ===================================================== */

    .blog-thumb {
      position: relative;
    }

    .blog-image-label {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 600;
      backdrop-filter: blur(6px);
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 768px) {

      .blog-featured {
        grid-template-columns: 1fr;
      }

      .blog-featured-card .blog-thumb {
        height: 220px;
      }

      .blog-mini-thumb {
        width: 90px;
        height: 75px;
      }

      .blog-featured-card .blog-body {
        padding: 24px;
      }

    }

    @media (max-width: 480px) {

      .blog-featured-card .blog-thumb {
        height: 190px;
      }

      .blog-mini-card {
        padding: 12px;
      }

      .blog-mini-thumb {
        width: 80px;
        height: 65px;
      }

      .blog-category-bar {
        justify-content: flex-start;
      }

    }

  </style>
</head>
